<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    木火账房 · 应用图标（小尺寸版，用于 16 / 24px）
    ============================================================
    ★ 为什么小尺寸要单独画一版，而不是把详细版缩小：
      48 网格缩到 16px 时，三片叶子的宽度不足 1 个像素，只会糊成一团灰绿；
      12px 的圆角也会把深色底吃掉大半，远看是个圆点而不是"方章"。

    ★ 为什么小尺寸要用**更浅**的两档色：
      详细版用的是 wood-500（松绿）压在近黑底上，大尺寸下层次好看，
      但缩到 16px 时对比度不足，整体糊成一个暗块 —— 图标在任务栏里
      认不出来，配色再讲究也没用。
      这里改用色板里更浅的档位：wood-300/400、fire-400。
      **色相不变**，只是提亮，所以仍与界面同源，不是另起一套颜色。

    ★ 只保留能认出是它的特征：深色方章（土）＋粗树干（木）＋贴地一簇火（火）。
      枝叶、地面线、三点水全部去掉 —— 16px 下它们只是噪点。
  -->
  <defs>
    <linearGradient id="ws" x1="24" y1="38" x2="24" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ea186"/>
      <stop offset="100%" stop-color="#a3c8b9"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="6" fill="#2f2f33"/>

  <!-- 木：主干（用神，主角）。加粗到 5.4，缩到 16px 仍约 1.8px 可见 -->
  <path d="M24 38.5V11.5" stroke="url(#ws)" stroke-width="5.4" stroke-linecap="round"/>

  <!-- 火：喜神，贴地一簇。放大并提亮，保证 16px 能看清是一簇火 -->
  <path d="M24 30.5c3.4 3.7 5.9 6.5 5.9 9.4 0 3.1-2.6 5.2-5.9 5.2s-5.9-2.1-5.9-5.2c0-2.9 2.5-5.7 5.9-9.4Z"
        fill="#b49288"/>
</svg>