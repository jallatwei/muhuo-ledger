# =============================================================================
#  本地开发环境编排（只负责"怎么跑起来"，不含任何业务逻辑）
#
#  用法：
#    cp deploy/env/.env.dev.example deploy/env/.env.dev
#    docker compose -f docker/dev/docker-compose.yml --env-file deploy/env/.env.dev up -d
#
#  说明：node_modules 使用**匿名卷**隔离，保证容器内 Linux 原生依赖
#       （Prisma 引擎、esbuild、bcrypt）不会被 Windows 宿主目录覆盖。
# =============================================================================

name: bookkeeper-dev

services:
  # ---------------------------------------------------------------- 数据库
  postgres:
    image: postgres:16-alpine
    container_name: bk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookkeeper_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-bookkeeper_dev}
      TZ: ${TZ:-Asia/Shanghai}
      # 中文排序与比较（会计摘要、单位名称排序需要）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 宿主机端口默认 5433，避免与本机已装的 PostgreSQL 冲突
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookkeeper} -d ${POSTGRES_DB:-bookkeeper_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------- 后端 API
  api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: bk-api
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -c "pnpm install --frozen-lockfile=false &&
             pnpm --filter @bookkeeper/api exec prisma generate &&
             pnpm --filter @bookkeeper/api dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/data/attachments}
      STORAGE_MAX_FILE_MB: ${STORAGE_MAX_FILE_MB:-50}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-20}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.85}
      AI_SUGGEST_MIN_CONFIDENCE: ${AI_SUGGEST_MIN_CONFIDENCE:-0.75}
      BOOKKEEPING_AUTO_POST: ${BOOKKEEPING_AUTO_POST:-false}
      BOOKKEEPING_AUTO_POST_MAX_AMOUNT: ${BOOKKEEPING_AUTO_POST_MAX_AMOUNT:-1000}
      BOOKKEEPING_DB_CONSTRAINTS: ${BOOKKEEPING_DB_CONSTRAINTS:-true}
      RULE_PROMOTION_THRESHOLD: ${RULE_PROMOTION_THRESHOLD:-3}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-2000}
      JOB_BATCH_SIZE: ${JOB_BATCH_SIZE:-5}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      # 容器内监听所有网卡，否则宿主机访问不到
      HOST: 0.0.0.0
    ports:
      - "${API_HOST_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - ../..:/workspace                       # 源码挂载：改代码即热重载
      - /workspace/node_modules                # ★ 匿名卷：隔离容器内 Linux 依赖
      - /workspace/apps/api/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/shared/node_modules
      - /workspace/apps/api/dist
      - /workspace/packages/shared/dist
      - attachments:/data/attachments           # 原始单据持久化
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------- 前端 Web
  web:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: bk-web
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -c "pnpm install --frozen-lockfile=false &&
             pnpm --filter @bookkeeper/web dev --host 0.0.0.0 --port ${WEB_PORT:-5173}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Asia/Shanghai}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    ports:
      - "${WEB_HOST_PORT:-5173}:${WEB_PORT:-5173}"
    volumes:
      - ../..:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/shared/node_modules
      - /workspace/apps/web/dist
      - /workspace/packages/shared/dist
    depends_on:
      - api
    stdin_open: true
    tty: true

  # ------------------------------------------------- 数据库管理界面（可选）
  # 启动：docker compose ... --profile tools up -d
  adminer:
    image: adminer:4
    container_name: bk-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: bk-postgres-data
  attachments:
    name: bk-attachments
